# Sweetlock example config, with every key at its default.
# Copy it to ~/.config/sweetlock/config.toml and change what you like.
# Any scalar key can also be set from the command line:
#   sweetlock --set background.color=#000000
#   sweetlock --set background.mode=radial

[background]
# "solid", "gradient", "radial", "layered" or "image". Anything but solid is
# drawn once per output size and cached in ~/.cache/sweetlock (up to 6
# entries, each 4 bytes a pixel), so later locks read it back in one go
mode = "solid"
# The solid colour, and the first frame shown in every mode, as "#rrggbb".
# Backgrounds are opaque, so the alpha of "#rrggbbaa" is ignored here and in
# the gradient and radial colours
color = "#1f1b2e"

# Four corners, blended smoothly between them
[background.gradient]
top_left = "#2b2342"
top_right = "#1f1b2e"
bottom_left = "#1f1b2e"
bottom_right = "#2b2342"

# Positions and sizes are percent of the output, so on a wide screen the
# circle is an ellipse
[background.radial]
center = "#373057"
edge = "#1f1b2e"
center_x = 50
center_y = 50
# Percent of the distance from the centre to the farthest corner, 1 to 200
radius = 80

[background.layered]
# "solid" (background.color), "gradient" or "radial", from the tables above
base = "radial"

# Soft round blobs drawn over the base, at most three. A blob fades from its
# colour to nothing; the alpha of "#rrggbbaa" is its strength. x, y and size
# (the radius, 1 to 100) are percent of the output. A [[blob]] list in your
# config replaces these two, and a key it leaves out defaults to
# color = "#ffffff2e", x = 50, y = 50, size = 36. Blobs can only be set here,
# not with --set
[[background.layered.blob]]
color = "#6a5a9e59"
x = 30
y = 35
size = 45

[[background.layered.blob]]
color = "#3e6a9a40"
x = 72
y = 70
size = 38

# A wallpaper, for mode = "image". Also: --image PATH (which sets the mode
# too), --fit, --dim and --blur
[background.image]
# A PNG or JPEG, as an absolute path or one starting with ~/. A missing or
# unreadable file keeps background.color
path = ""
# "fill" covers the output and crops, "fit" shows all of it on
# background.color, "center" puts one image pixel on each output pixel,
# "stretch" ignores the aspect ratio
fit = "fill"
# Darkens the image, in percent, 0 to 100
dim = 0
# Blur strength in logical pixels (a Gaussian's sigma), 0 to 100; 0 is off
blur = 0

[clock]
enabled = true
# strftime(3) format; the clock ticks every second when it shows seconds
format = "%H:%M"

[date]
enabled = true
# strftime(3) format; day and month names follow LC_TIME
format = "%A, %B %-d"

[avatar]
# With the avatar and the username both off, the clock and date take their
# place above the password field
enabled = true
# A PNG or JPEG, as an absolute path or one starting with ~/ (up to 4095 bytes;
# relative paths are rejected). Empty: the
# AccountsService icon (/var/lib/AccountsService/icons/LOGIN), then ~/.face,
# then a drawn outline. Pictures that are not square show their centre.
path = ""

[username]
enabled = true
# Empty: the full name from the account (GECOS), then the login name
text = ""

[input]
# Shown in the empty password field
placeholder = "Password"
# The eye in the field that shows the typed text
reveal_toggle = true
# Where the keyboard layout shows when the keymap has more than one:
# "status" puts its name on the status line under the field, "corner" puts
# its code (US, LV) in a round badge at the top right of every output
layout = "status"

[ui]
# The output that shows the clock and the login, for example "DP-1", the
# others show only the background. Empty puts them on every output, and so
# does a name no connected output has.
output = ""

[screen_off]
# Seconds without input on the lock screen before every output powers off,
# up to 3600, for example 60; 0 never. A key or click powers them back on
# and is not typed. Turning them off wipes a half-typed password.
timeout = 0

[theme]
# A fontconfig family, or a comma-separated list of them
font = "sans-serif"
# Colours as "#rrggbb" or "#rrggbbaa"
# The username, the avatar outline and the field's text
foreground = "#e8e6f0"
# The clock, the date, the eye and "Checking..."
muted = "#a9a4bd"
# The password field and the avatar's circle; use the alpha to tint
field = "#ffffff1a"
# A wrong password
error = "#e06c75"
