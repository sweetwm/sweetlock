# Sweetlock example config, with every key at its default.
# Copy it to ~/.config/sweetlock/config.toml and change what you like.
# Any scalar key can also be set from the command line:
#   sweetlock --set background.color=#000000

[background]
# Solid colour, and the first frame shown, as "#rrggbb"; the lock is
# opaque, so the alpha of "#rrggbbaa" is ignored
color = "#1f1b2e"

[clock]
enabled = true
# strftime(3) format; the clock ticks every second when it shows seconds
format = "%H:%M"

[date]
enabled = true
# strftime(3) format; day and month names follow LC_TIME
format = "%A, %B %-d"

[avatar]
enabled = true
# A PNG, as an absolute path or one starting with ~/. Empty: the
# AccountsService icon (/var/lib/AccountsService/icons/LOGIN), then ~/.face,
# then a drawn outline. Pictures that are not square show their centre.
path = ""

[username]
enabled = true
# Empty: the full name from the account (GECOS), then the login name
text = ""

[input]
# Shown in the empty password field
placeholder = "Password"
# The eye in the field that shows the typed text; clicking it is the only
# use of the pointer
reveal_toggle = true

[theme]
# A fontconfig family, or a comma-separated list of them
font = "sans-serif"
# Colours as "#rrggbb" or "#rrggbbaa"
# The username, the avatar outline and the field's text
foreground = "#e8e6f0"
# The clock, the date, the eye and "Checking..."
muted = "#a9a4bd"
# The password field and the avatar's circle; use the alpha to tint
field = "#ffffff1a"
# A wrong password
error = "#e06c75"
